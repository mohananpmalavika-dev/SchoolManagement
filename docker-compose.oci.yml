version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: krypton_oci_postgres
    restart: always
    environment:
      POSTGRES_USER: krypton
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: krypton
    volumes:
      - oci_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krypton -d krypton"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - krypton_net

  redis:
    image: redis:7-alpine
    container_name: krypton_oci_redis
    restart: always
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - oci_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - krypton_net

  # Private S3-compatible object storage (ARM64 + AMD64) for Preschool Photos, Chat Attachments & Backups.
  # Stays strictly on krypton_net; browsers only read objects via short-lived SigV4 presigned URLs proxied by Nginx.
  minio:
    image: ${MINIO_IMAGE:-alpine/minio:RELEASE.2025-10-15T17-29-55Z}
    container_name: krypton_oci_minio
    restart: always
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kryptonadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.oci or run ./deploy-oci.sh}
    command: server /data --console-address ":9001"
    volumes:
      - oci_minio_data:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9000/minio/health/live || curl -sf http://localhost:9000/minio/health/live || mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks:
      - krypton_net

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrations
    container_name: krypton_oci_migrate
    environment:
      DATABASE_URL: postgresql://krypton:${DB_PASSWORD}@postgres:5432/krypton
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - krypton_net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    container_name: krypton_oci_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://krypton:${DB_PASSWORD}@postgres:5432/krypton
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${PUBLIC_DOMAIN:-https://localhost}
      WEB_URL: ${PUBLIC_DOMAIN:-https://localhost}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # S3-Compatible Object Storage (Bundled MinIO by default; override in .env.oci for AWS S3 / OCI Object Storage)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-krypton-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-kryptonadmin}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-${PUBLIC_DOMAIN:-http://localhost}}
      # Classroom CCTV Live Streaming Gateway (set all three together; internal http://cctv-gateway:4010/api is supported)
      CCTV_GATEWAY_URL: ${CCTV_GATEWAY_URL:-}
      CCTV_GATEWAY_KEY: ${CCTV_GATEWAY_KEY:-}
      CCTV_PLAYBACK_ORIGINS: ${CCTV_PLAYBACK_ORIGINS:-}
      CCTV_ALLOW_INSECURE_HTTP: ${CCTV_ALLOW_INSECURE_HTTP:-false}
      # Indian Gateway & WhatsApp Integrations
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      # INKY Preschool AI & Teacher AI Assistant
      # Leave AI_PROVIDER empty to auto-detect from configured keys (Gemini -> Groq -> OpenAI -> Ollama),
      # or set explicitly: Gemini | Groq | OpenAI | Ollama | Pollinations | FreeAI.
      AI_TEACHER_ENABLED: ${AI_TEACHER_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - krypton_net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: krypton_oci_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${PUBLIC_DOMAIN:-http://localhost}/api
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - krypton_net

  # Lightweight RTSP/SRT -> WebRTC (WHEP) & LL-HLS Streaming Engine (ARM64 + AMD64)
  # Stays strictly behind cctv-gateway for HTTP/API auth; only ICE (8189) & SRT ingest (8890) are published.
  mediamtx:
    image: bluenviron/mediamtx:1.12.2
    container_name: krypton_oci_mediamtx
    restart: always
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${OCI_PUBLIC_IP:-}
    volumes:
      - ./services/cctv-gateway/mediamtx.oci.yml:/mediamtx.yml:ro
    ports:
      - "8189:8189/udp"
      - "8189:8189/tcp"
      - "8890:8890/udp"
    expose:
      - "8554"
      - "8888"
      - "8889"
      - "9997"
    networks:
      - krypton_net

  # OM System Hardware Bridge & Short-Lived Session Security Proxy
  cctv-gateway:
    build:
      context: ./services/cctv-gateway
      dockerfile: Dockerfile
    container_name: krypton_oci_cctv_gateway
    restart: always
    environment:
      PORT: 4010
      CCTV_GATEWAY_KEY: ${CCTV_GATEWAY_KEY:-${CCTV_GATEWAY_SECRET:-}}
      CCTV_SESSION_SECRET: ${CCTV_SESSION_SECRET:-}
      CCTV_INTERNAL_SECRET: ${CCTV_INTERNAL_SECRET:-}
      CCTV_PUBLISH_TOKEN: ${CCTV_PUBLISH_TOKEN:-}
      CCTV_PUBLIC_ORIGIN: ${CCTV_PLAYBACK_ORIGINS:-${PUBLIC_DOMAIN:-}}
      CCTV_FRAME_ANCESTORS: ${PUBLIC_DOMAIN:-}
      CCTV_ALLOW_INSECURE_HTTP: ${CCTV_ALLOW_INSECURE_HTTP:-false}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-stun:stun.l.google.com:19302}
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_WEBRTC_URL: http://mediamtx:8889
      MEDIAMTX_HLS_URL: http://mediamtx:8888
      CAMERAS_CONFIG_PATH: /app/config/cameras.json
      # Optional NVR password env vars referenced inside cameras.json via ${VAR_NAME}
      NVR_SCHOOL1_PASSWORD: ${NVR_SCHOOL1_PASSWORD:-}
    volumes:
      # Writable bind mount so UI/Admin API camera registrations persist directly to cameras.json
      - ./services/cctv-gateway/cameras.json:/app/config/cameras.json
    depends_on:
      - mediamtx
    expose:
      - "4010"
    networks:
      - krypton_net

  nginx:
    image: nginx:alpine
    container_name: krypton_oci_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_CONF_FILE:-./nginx/oci-nginx.conf}:/etc/nginx/conf.d/default.conf:ro
      - oci_certbot_www:/var/www/certbot:ro
      - oci_certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - api
      - cctv-gateway
      - minio
    networks:
      - krypton_net

  # On-demand Let's Encrypt certificate issuer/renewer sharing Nginx's ACME & cert volumes.
  # Invoked by: ./deploy-oci.sh --domain erp.yourschool.edu.in --email admin@yourschool.edu.in
  certbot:
    image: certbot/certbot:latest
    container_name: krypton_oci_certbot
    profiles: ["ssl"]
    volumes:
      - oci_certbot_www:/var/www/certbot
      - oci_certbot_conf:/etc/letsencrypt
    networks:
      - krypton_net

volumes:
  oci_postgres_data:
  oci_redis_data:
  oci_minio_data:
  oci_certbot_www:
  oci_certbot_conf:

networks:
  krypton_net:
    driver: bridge
