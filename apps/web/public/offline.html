<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2859ee">
  <title>You’re offline · Krypton</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #f2f6fc; color: #17263e; margin: 0; display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
    main { padding: 38px; width: min(100%, 460px); background: #fff; border: 1px solid #e0e9f7; border-radius: 18px; box-shadow: 0 15px 55px #2d51740a; }
    img { width: 53px; height: 53px; object-fit: contain; border: 1px solid #e0ebfa; border-radius: 12px; background: #f1f7ff; padding: 7px; margin-bottom: 24px; }
    small { display: block; color: #4a72bb; font-size: 10px; font-weight: 600; letter-spacing: 1.5px; }
    h1 { font-size: 28px; font-weight: 650; letter-spacing: -.8px; margin: 12px 0; }
    p { color: #696b80; font-size: 14px; line-height: 1.8; margin-bottom: 27px; }
    button { font: 600 13px "Segoe UI", system-ui, sans-serif; background: #2859ee; color: #fff; border: 1px solid #2859ee; min-height: 44px; padding: 12px 22px; border-radius: 8px; cursor: pointer; }
    button:hover { background: #2048c7; }
    button:focus-visible { outline: 3px solid #2859ee; outline-offset: 4px; }
    @media(max-width: 400px) { main { padding: 28px; } }
  </style>
</head>
<body>
  <main>
    <img src="/krypton-icon.png" alt="Krypton">
    <small>YOUR SCHOOL WORKSPACE</small>
    <h1>You’re offline.</h1>
    <p>Reconnect to access your school workspace. Your saved records will be available when you’re back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
