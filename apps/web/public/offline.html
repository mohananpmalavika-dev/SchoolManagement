<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6952bc">
  <title>You’re offline · HustlerTech</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #efecfa; color: #262638; margin: 0; display: grid; place-items: center; min-height: 100dvh; padding: 24px; }
    main { padding: 38px; width: min(100%, 450px); background: #fff; border: 1px solid #e7e6ee; border-radius: 23px; box-shadow: 0 12px 40px #28213b08; }
    img { width: 58px; height: 58px; object-fit: contain; border-radius: 15px; background: #eeebfa; padding: 7px; margin-bottom: 24px; }
    small { display: block; color: #6952bc; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; }
    h1 { font-size: 30px; letter-spacing: -1px; margin: 12px 0; }
    p { color: #696b80; font-size: 14px; line-height: 1.8; margin-bottom: 27px; }
    button { font: 600 13px "Segoe UI", system-ui, sans-serif; background: #6952bc; color: #fff; border: 0; min-height: 44px; padding: 12px 22px; border-radius: 10px; cursor: pointer; }
    button:hover { background: #55419f; }
    button:focus-visible { outline: 3px solid #6952bc; outline-offset: 4px; }
    @media(max-width: 400px) { main { padding: 28px; } }
  </style>
</head>
<body>
  <main>
    <img src="/hustlertech-logo.png" alt="HustlerTech">
    <small>YOUR SCHOOL WORKSPACE</small>
    <h1>You’re offline.</h1>
    <p>Reconnect to access your school workspace. Your saved records will be available when you’re back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
