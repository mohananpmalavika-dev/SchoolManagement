services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: krypton_qa
      POSTGRES_PASSWORD: local-qa-only
      POSTGRES_DB: krypton_qa
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krypton_qa -d krypton_qa"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - qa_database:/var/lib/postgresql/data
volumes:
  qa_database:
