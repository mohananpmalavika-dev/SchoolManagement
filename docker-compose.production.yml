services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: krypton
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      POSTGRES_DB: krypton
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U krypton -d krypton" ]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrations
    environment:
      DATABASE_URL: postgresql://krypton:${DB_PASSWORD}@postgres:5432/krypton
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [ "sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"' ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG' ]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment: &api-environment
      NODE_ENV: production
      DATABASE_URL: postgresql://krypton:${DB_PASSWORD}@postgres:5432/krypton
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS origin}
      WEB_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your HTTPS origin}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_SECRET: ${WEBRTC_TURN_SECRET:-}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?Set ENCRYPTION_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      BACKUP_DIR: /app/backups
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
      RESTORE_MAX_AGE_HOURS: ${RESTORE_MAX_AGE_HOURS:-840}
      BACKUP_REQUIRE_OFFSITE: ${BACKUP_REQUIRE_OFFSITE:-true}
      BACKUP_ENCRYPTION_KEY_FILE: /run/secrets/backup_key
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-krypton}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      CCTV_GATEWAY_URL: ${CCTV_GATEWAY_URL:-}
      CCTV_GATEWAY_KEY: ${CCTV_GATEWAY_KEY:-}
      CCTV_PLAYBACK_ORIGINS: ${CCTV_PLAYBACK_ORIGINS:-}
      AI_TEACHER_ENABLED: ${AI_TEACHER_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      PAYMENT_GATEWAY_CALLBACK_URL: ${PAYMENT_GATEWAY_CALLBACK_URL:-}
      SCHOOL_UPI_VPA: ${SCHOOL_UPI_VPA:-}
      SCHOOL_MERCHANT_NAME: ${SCHOOL_MERCHANT_NAME:-}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORT_CODE: ${MPESA_SHORT_CODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_BASE_URL: ${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_CALLBACK_TOKEN: ${MPESA_CALLBACK_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_USERNAME: ${SMS_USERNAME:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - backups:/app/backups
    secrets:
      - backup_key
    ports:
      - "127.0.0.1:3001:3001"
  maintenance:
    profiles: [ operations ]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: operations
    environment:
      <<: *api-environment
    volumes:
      - backups:/app/backups
    secrets:
      - backup_key
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
  bootstrap:
    extends:
      service: maintenance
    command: [ bootstrap-admin ]
    environment:
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_FIRST_NAME: ${INITIAL_ADMIN_FIRST_NAME:-}
      INITIAL_ADMIN_LAST_NAME: ${INITIAL_ADMIN_LAST_NAME:-}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-}
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
    secrets:
      - initial_admin_password
  rehearsal:
    extends:
      service: maintenance
    command: [ rehearse ]
    environment:
      RESTORE_DATABASE_URL_FILE: /run/secrets/restore_database_url
      RESTORE_BACKUP_ID: ${RESTORE_BACKUP_ID:-}
      RESTORE_EXPECTED_TABLES: ${RESTORE_EXPECTED_TABLES:-}
      RESTORE_EXPECTED_TENANTS: ${RESTORE_EXPECTED_TENANTS:-}
      RESTORE_EXPECTED_USERS: ${RESTORE_EXPECTED_USERS:-}
    secrets:
      - restore_database_url
  edge:
    profiles: [ https ]
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      TLS_CONTACT_EMAIL: ${TLS_CONTACT_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - tls-data:/data
    depends_on:
      - web
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  database:
  redis-data:
  backups:
    external: true
    name: ${BACKUP_VOLUME_NAME:-krypton_backups}
  tls-data:
    external: true
    name: ${TLS_VOLUME_NAME:-krypton_tls_data}
secrets:
  backup_key:
    file: ${BACKUP_KEY_SECRET_FILE:?Set BACKUP_KEY_SECRET_FILE to an externally retained encryption key file}
  initial_admin_password:
    file: ${INITIAL_ADMIN_PASSWORD_SECRET_FILE:-/etc/krypton/initial-admin-password}
  restore_database_url:
    file: ${RESTORE_DATABASE_SECRET_FILE:-/etc/krypton/restore-database-url}
