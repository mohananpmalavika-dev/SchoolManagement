# Production HTTPS Nginx Config for Oracle Cloud (OCI) with Let's Encrypt SSL
# Required for Krypton ERP Classroom CCTV Live Streaming (HTTPS gateway + mobile WebRTC)
#
# Usage:
#   1. Replace YOUR_SCHOOL_DOMAIN below (e.g., erp.yourschool.edu.in)
#   2. Issue SSL cert with Certbot into /etc/letsencrypt (mounted as oci_certbot_conf)
#   3. In .env.oci, set:
#        NGINX_CONF_FILE=./nginx/oci-nginx-ssl.conf
#        PUBLIC_DOMAIN=https://YOUR_SCHOOL_DOMAIN
#        CCTV_GATEWAY_URL=https://YOUR_SCHOOL_DOMAIN/cctv-gateway/api
#        CCTV_PLAYBACK_ORIGINS=https://YOUR_SCHOOL_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_SCHOOL_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_SCHOOL_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/YOUR_SCHOOL_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_SCHOOL_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 64M;

    # CCTV Gateway Session API (authenticated via Bearer CCTV_GATEWAY_KEY)
    location /cctv-gateway/api/ {
        proxy_pass http://cctv-gateway:4010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    # CCTV Secure Embeddable Viewer, WebRTC (WHEP) Signaling & LL-HLS Segment Proxy
    location /cctv/ {
        proxy_pass http://cctv-gateway:4010/cctv/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Private S3/MinIO object access (strictly authenticated via short-lived SigV4 presigned URLs)
    location /krypton-media/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # NestJS API
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    # Real-time WebSocket connection
    location /socket.io/ {
        proxy_pass http://api:3001/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js Frontend
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
