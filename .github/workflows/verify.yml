name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [16379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: krypton_qa
          POSTGRES_PASSWORD: local-qa-only
          POSTGRES_DB: krypton_qa
        ports: [15432:5432]
        options: --health-cmd "pg_isready -U krypton_qa -d krypton_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_qa
      JWT_SECRET: ci-only-access-secret-never-use-in-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-never-use-in-production
      ENCRYPTION_MASTER_KEY: ci-only-master-key-never-use-in-production
      ENCRYPTION_SALT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 16379
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm --filter @krypton/web lint
      - name: Verify operator commands and CI acceptance gate
        run: node --test scripts/test-operations.cjs
      - name: Validate production Compose inheritance and isolation
        run: node scripts/test-production-compose.cjs
      - run: pnpm db:deploy && pnpm db:seed:demo
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify preschool staff and family browser workflows
        run: |
          pnpm --filter @krypton/web exec next start --hostname 127.0.0.1 --port 3102 > preschool-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3102/login && break || sleep 2; done
          pnpm test:ui:all
        env:
          UI_BASE_URL: http://127.0.0.1:3102
      - name: Verify all API suites with PostgreSQL and browser checks; reject skips
        run: |
          mkdir -p qa/ci
          pnpm --filter @krypton/api test -- --runInBand --json --outputFile=../../qa/ci/api-results.json
          node scripts/check-jest-results.cjs qa/ci/api-results.json
        env:
          PRESCHOOL_TEST_DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_qa
          SCHOOL_TEST_DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_qa
          COMPLIANCE_TEST_DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_qa
          SCHOOL_UI_BASE_URL: http://127.0.0.1:3102
          LIVE_UI_BASE_URL: http://127.0.0.1:3102
          COMPLIANCE_UI_BASE_URL: http://127.0.0.1:3102
      - name: Replay migrations and verify historical data preservation
        run: |
          createdb -h 127.0.0.1 -p 15432 -U krypton_qa krypton_migrations_test
          pnpm test:db:preschool-migrations
        env:
          PGPASSWORD: local-qa-only
          PRESCHOOL_MIGRATION_TEST_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_migrations_test
      - name: Verify HR statutory profiles, salary revisions and payroll period locking
        run: |
          createdb -h 127.0.0.1 -p 15432 -U krypton_qa hrms_rules_test
          pnpm --filter @krypton/database db:migrate:deploy
          node scripts/test-hrms-workflows.cjs
          node scripts/test-hrms-ui.mjs
        env:
          PGPASSWORD: local-qa-only
          DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/hrms_rules_test
          HRMS_TEST_DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/hrms_rules_test
          UI_BASE_URL: http://127.0.0.1:3102
      - name: Rehearse encrypted database backup and recovery
        run: |
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          createdb -h 127.0.0.1 -p 15432 -U krypton_qa krypton_backup_source_test
          createdb -h 127.0.0.1 -p 15432 -U krypton_qa krypton_backup_restore_test
          pnpm test:db:school-backup
        env:
          PGPASSWORD: local-qa-only
          SCHOOL_BACKUP_TEST_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_backup_source_test
          SCHOOL_BACKUP_RESTORE_DATABASE: krypton_backup_restore_test
      - run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/v1/health/ready && break || sleep 2; done
          curl -fsS http://localhost:3001/api/v1/health/ready
          pnpm test:smoke
      - run: pnpm audit --prod --audit-level high
      - name: Retain test reports and startup logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}
          path: |
            qa/
            api.log
            preschool-web.log
            playwright-report/
            test-results/
          retention-days: 14
