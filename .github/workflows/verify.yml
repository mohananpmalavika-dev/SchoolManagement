name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: [16379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: krypton_qa
          POSTGRES_PASSWORD: local-qa-only
          POSTGRES_DB: krypton_qa
        ports: [15432:5432]
        options: --health-cmd "pg_isready -U krypton_qa -d krypton_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://krypton_qa:local-qa-only@127.0.0.1:15432/krypton_qa
      JWT_SECRET: ci-only-access-secret-never-use-in-production
      JWT_REFRESH_SECRET: ci-only-refresh-secret-never-use-in-production
      ENCRYPTION_MASTER_KEY: ci-only-master-key-never-use-in-production
      ENCRYPTION_SALT: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 16379
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm type-check
      - run: pnpm --filter @krypton/api test -- --runInBand
      - run: pnpm db:deploy && pnpm db:seed:demo
      - run: |
          node apps/api/dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:3001/api/v1/health && break || sleep 2; done
          pnpm test:smoke
      - run: pnpm audit --prod --audit-level high
